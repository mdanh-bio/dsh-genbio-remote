- insert:
    - id: genbio-remote
      name: dsh-genbio-remote
      config:
        policyPath: /absolute/path/to/genbio-compute-policy.yaml
        policyPollMs: 15000
        commandTimeoutMs: 30000
        smokeTimeoutMs: 180000
        logMaxBytes: 65536
        memoryMode: manual
        projectsDir: /absolute/path/to/central-genbio-projects
        workflowRegistryDir: /absolute/path/to/genbio-workflow-registry
        executionRegistryDir: /absolute/path/to/genbio-execution-registry
        runRegistryDir: /absolute/path/to/genbio-run-registry
        h100DirectProjectsDir: /absolute/path/to/genbio-h100-direct-projects
        h100MirrorManifestPath: /absolute/path/to/genbio-h100-mirror/mirror-manifest.yaml
        aizymeLocalRemoteBundle: /absolute/path/to/aizyme_v1/remote
        rcloneRemote:
          HPC: your-hpc-rclone-remote
          NHPC: your-nhpc-rclone-remote
          genbioh100: your-h100-rclone-remote
          genbio_mdanh: your-direct-rclone-remote

- id: openviking-memory
  insert:
    - id: genbio-openviking
      name: dsh-genbio-remote/openviking
